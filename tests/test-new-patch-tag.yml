name: Test new patch tag from fix commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git history with a fix commit after a tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Tag an earlier commit as v1.0.0
          git tag v1.0.0
          # Make a new fix commit after the tag
          echo "patch change" >> /tmp/patch-file.txt
          cp /tmp/patch-file.txt "$GITHUB_WORKSPACE/patch-file.txt"
          git add "$GITHUB_WORKSPACE/patch-file.txt"
          git commit -m "fix: apply a patch fix"
          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          write-tag: 'true'

      - name: Assert new-tag is true
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag }}
        run: |
          echo "actual new-tag: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected new-tag=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new-tag-version is v1.0.1
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag-version }}
        run: |
          echo "actual new-tag-version: $ACTUAL"
          if [ "$ACTUAL" != "v1.0.1" ]; then
            echo "FAIL: expected new-tag-version=v1.0.1 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
