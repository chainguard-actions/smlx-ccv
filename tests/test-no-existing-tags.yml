name: Test no existing tags (first version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Remove all existing tags from the workspace so ccv sees no tags
      - name: Set up workspace with no tags and a feat commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          # Delete all local tags
          git tag -l | xargs -r git tag -d
          # Add a feat commit so ccv has something to analyze
          git commit --allow-empty -m "feat: initial commit for test"

      - id: action
        uses: .
        with:
          write-tag: 'false'

      - name: Assert new-tag is true
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag }}
        run: |
          echo "actual new-tag: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected new-tag=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new-tag-version is v0.1.0
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag-version }}
        run: |
          echo "actual new-tag-version: $ACTUAL"
          if [ "$ACTUAL" != "v0.1.0" ]; then
            echo "FAIL: expected new-tag-version=v0.1.0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new-tag-version-type is minor
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag-version-type }}
        run: |
          echo "actual new-tag-version-type: $ACTUAL"
          if [ "$ACTUAL" != "minor" ]; then
            echo "FAIL: expected new-tag-version-type=minor but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
