name: Test no new tag needed (HEAD already tagged)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity and tag HEAD, then set up reachable origin
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Tag the current HEAD so ccv sees it as already tagged
          git tag v1.0.0
          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          write-tag: 'true'

      - name: Assert new-tag is false
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag }}
        run: |
          echo "actual new-tag: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected new-tag=false but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new-tag-version is empty
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag-version }}
        run: |
          echo "actual new-tag-version: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected new-tag-version to be empty but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
