name: Test minor version bump from feat commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Set up workspace with a tag and a feat commit after it
      - name: Set up workspace with feat commit after tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          # Delete all local tags
          git tag -l | xargs -r git tag -d
          # Add a commit, tag it, then add a feat commit
          git commit --allow-empty -m "chore: initial setup"
          git tag v1.2.0
          git commit --allow-empty -m "feat: add new feature"

      - id: action
        uses: .
        with:
          write-tag: 'false'

      - name: Assert new-tag is true
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag }}
        run: |
          echo "actual new-tag: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected new-tag=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new-tag-version is v1.3.0
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag-version }}
        run: |
          echo "actual new-tag-version: $ACTUAL"
          if [ "$ACTUAL" != "v1.3.0" ]; then
            echo "FAIL: expected new-tag-version=v1.3.0 but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert new-tag-version-type is minor
        env:
          ACTUAL: ${{ steps.action.outputs.new-tag-version-type }}
        run: |
          echo "actual new-tag-version-type: $ACTUAL"
          if [ "$ACTUAL" != "minor" ]; then
            echo "FAIL: expected new-tag-version-type=minor but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
